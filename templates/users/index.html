

{% block content %}
<head>
   
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Akt:wght@100..900&family=Bebas+Neue&family=Bitcount+Prop+Single:wght@100..900&family=Bungee+Shade&family=Geist+Pixel&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body class="bg-[#E6F2DD] h-screen w-screen overflow-hidden">

<form action="" method="post">
    {% csrf_token %}
    <div class="titulo-form">
<h1 class="titulo">Registro</h1>
    </div>

    <div class="container-labels">

        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre_usuario" required>
        
        <label for="apellido">Apellido:</label>
        <input type="text" name="apellido_usuario" required>
        
        <label for="correo">Correo:</label>
        <input type="email" name="correo_usuario" required>
        
        <label for="clave">Clave:</label>
        <input type="password" name="password" required>
        
        <label for="clave_confirm">Clave confirmada:</label>
        <input type="password" name="password_confirm" required>

        <label for="Rol">Rol:</label>
        <select class="rol-choose" name="rol">
            <option value="Profesional">Profesional</option>
             <option value="Cliente">Cliente</option>
        </select>

        <div class="btns">
            <input type="Submit" name="btn-registrar" value="Registrarse">
        </div>
        
    </div>

     <div class="links">
            <a href="{% url 'inicio_sesion' %}">¿Tienes cuenta? Inicia Sesion</a>
        </div>

</form>

</body>
{%endblock  %}

{% block content  %}
<head>
   
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Akt:wght@100..900&family=Bebas+Neue&family=Bitcount+Prop+Single:wght@100..900&family=Bungee+Shade&family=Geist+Pixel&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#E6F2DD] h-screen w-screen overflow-hidden">

    <!-- 🌟 IMG FONDO -->
    <div class="flex h-full w-full bg-[#e6f2dd]">
        
      
        <div class="relative hidden w-2/3 h-full md:block">
           
            <div class="absolute inset-0 bg-[url('/static/IMG/img_fondo.jpg')] bg-cover bg-center"></div>
            
           
            <div class="absolute inset-0 bg-[linear-gradient(to_right,transparent_70%,#e6f2dd_100%)]"></div>
        </div>

       
        <div class="flex flex-1 justify-center items-center p-4 h-full">
            
            <!--🌟 FORMULARIO -->
            <div class="form-login bg-white flex flex-col p-7 w-full max-w-sm h-auto rounded-md shadow-lg">
                
                <div class="titulo-form text-center mb-5">
                    <h1 class="titulo text-[#659287] font-[Roboto] font-extrabold text-xl">Inicio de Sesion</h1>
                </div>

                {% if  messages %}
                
                {% for message in messages %}
                <div class=" text-center text-red-500 font-bold">
                    <p class="error">{{message}}</p>
                </div>
                
                {% endfor %}
                {% endif %}

                <form action="/inicio_sesion/" method="post">
                    {% csrf_token %}
                   
                    <div class="container-labels flex flex-col gap-2">
                        <label for="correo">Correo:</label>
                        <input type="email" name="correo_usuario" placeholder="correo" class="rounded-md bg-[#E8E1E1] p-1 focus:outline focus:outline-[#659287]" required>
                        
                        <label for="clave">Clave:</label>
                        <input type="password" name="clave" placeholder="clave" class="rounded-md bg-[#E8E1E1] p-1 focus:outline focus:outline-[#659287]" required>

                        <div class="btns flex flex-row justify-center mt-2">
                            <input class="transition hover:bg-[#659287] bg-[#88BDA4] text-white rounded-md p-2 w-full cursor-pointer" type="submit" name="btn-ingresar" value="Entrar">
                        </div>
                    </div>

                    <div class="links text-center mt-4">
                        <a href="{% url 'registro' %}" class="transition hover:text-[#659287] underline decoration-solid text-[#88BDA4]">¿No tienes cuenta? Registrate</a>
                    </div>
                </form>

            </div> 

        </div> 

    </div> 

</body>

{% endblock  %}
